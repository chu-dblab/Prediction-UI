<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>落點分析 - 2022 升大學職涯型分科測驗落點分析/預測</title>
  <link rel="stylesheet" href="../css/predict.css">
  <script src="../assets/modernizr.js"></script>
</head>

<body>

<!-- ref:include oldie -->
<!-- endref -->

<section id="header" class="page-section">
  <header>
    <div class="inner">
      <h1>
        <a href="#">
          2022升大學職涯型<strong class="breakline">分科測驗落點分析</strong>
        </a>
      </h1>
    </div>
  </header>

  <div id="input-area">
    <form id="input-form">

      <!-- 通知放置處 -->
      <div class="alerts-area">
        <noscript>
          <div id="no-js-error" data-alert class="alert-box alert radius">
            <strong>本網頁必須啟用JavaScript才能正常運作喔～</strong>
            <a href="#" class="close">&times;</a>
          </div>
        </noscript>
      </div>

      <!-- 您所期望的薪資 -->
      <div id="input-expect-salary-area">
        <label><h2>畢業後的期望月薪&nbsp;</h2>
          <input type="number" id="input-expect-salary" step="any" min="0" max="99999"><span>元以上</span>
          <p><small>（未填則會列出所有校系）</small></p>
        </label>
      </div>

      <!-- 輸入分科測驗成績 -->
      <div id="input-ast-score">
        <h2>輸入分科測驗成績<small>（60級分制，未考部分請留空白）</small></h2>
        <ul>
          <li>
            <label>
              <span>數學甲</span>
              <input type="number" id="input-ast-math-a" class="input-score" min="0" max="60">
            </label>
          </li>
          <li>
            <label>
              <span>歷史</span>
              <input type="number" id="input-ast-history" class="input-score" min="0" max="60">
            </label>
          </li>
          <li>
            <label>
              <span>地理</span>
              <input type="number" id="input-ast-geography" class="input-score" min="0" max="60">
            </label>
          </li>
          <li>
            <label>
              <span>公民</span>
              <input type="number" id="input-ast-citizen" class="input-score" min="0" max="60">
            </label>
          </li>
          <li>
            <label>
              <span>物理</span>
              <input type="number" id="input-ast-physics" class="input-score" min="0" max="60">
            </label>
          </li>
          <li>
            <label>
              <span>化學</span>
              <input type="number" id="input-ast-chemistry" class="input-score" min="0" max="60">
            </label>
          </li>
          <li>
            <label>
              <span>生物</span>
              <input type="number" id="input-ast-biology" class="input-score" min="0" max="60">
            </label>
          </li>
        </ul>
        <h2>輸入學測成績<small>（60級分制，未考部分請留空白）</small></h2>
        <ul>
          <li>
            <label>
              <span>國文</span>
              <input type="number" id="input-ast-chinese" class="input-score" min="0" max="60">
            </label>
          </li>
          <li>
            <label>
              <span>英文</span>
              <input type="number" id="input-ast-english" class="input-score" min="0" max="60">
            </label>            
          </li>
          <li>
            <label>
              <span>數學Ａ</span>
              <input type="number" id="subject-test-math-a" class="input-score" min="0" max="60">
            </label>
          </li>
          <li>
            <label>
              <span>數學Ｂ</span>
              <input type="number" id="subject-test-math-b" class="input-score" min="0" max="60">
            </label>
          </li>
          <li>
            <label>
              <span>社會</span>
              <input type="number" id="subject-test-society" class="input-score" min="0" max="60">
            </label>
          </li>
          <li>
            <label>
              <span>自然</span>
              <input type="number" id="subject-test-science" class="input-score" min="0" max="60">
            </label>
          </li>
        </ul>
      </div>

      <!-- 輸入學測成績 -->
      <div id="input-gsat-score">
        <h2>輸入學測成績<small>（15級分制，未填則無法顯示需通過檢定標準之校系）</small></h2>
        <ul>
          <li>
            <label>
              <span>國文</span>
              <input type="number" id="input-gsat-chinese" class="input-score" min="0" max="15">
            </label>
          </li>
          <li>
            <label>
              <span>英文</span>
              <input type="number" id="input-gsat-english" class="input-score" min="0" max="15">
            </label>
          </li>
          <li>
            <label>
              <span>數學Ａ</span>
              <input type="number" id="input-gsat-matha" class="input-score" min="0" max="15">
            </label>
          </li>
          <li>
            <label>
              <span>數學Ｂ</span>
              <input type="number" id="input-gsat-mathb" class="input-score" min="0" max="15">
            </label>
          </li>
          <li>
            <label>
              <span>社會</span>
              <input type="number" id="input-gsat-society" class="input-score" min="0" max="15">
            </label>
          </li>
          <li>
            <label>
              <span>自然</span>
              <input type="number" id="input-gsat-science" class="input-score" min="0" max="15">
            </label>
          </li>
          <li>
            <label>
              <span>英聽</span>
              <select id="input-gsat-english-listen" class="input-score">
                <option value=""></option>
                <option value="A">A</option>
                <option value="B">B</option>
                <option value="C">C</option>
                <option value="F">F</option>
              </select>
            </label>
          </li>
        </ul>
      </div>

      <!-- 輸入學群 -->
      <div id="input-department-group-area">
        <h2>選擇學群</h2>
        <a id="input-department-group-more" >
          <p id="department-group-choose-list">工程學群, 資訊學群</p>
          <span class="more-button">&#x25BC;</span>
        </a>

        <!-- 選擇學群 -->
        <div id="input-department-group-choose-area" class="hidden">
          <ul>
            <li>
              <label><input type="checkbox" name="input-department-group" value="工程學群"><span>工程學群</span></label>
            </li>
            <li>
              <label><input type="checkbox" name="input-department-group" value="數理化學群"><span>數理化學群</span></label>
            </li>
            <li>
              <label><input type="checkbox" name="input-department-group" value="資訊學群"><span>資訊學群</span></label>
            </li>
            <li>
              <label><input type="checkbox" name="input-department-group" value="地球環境學群"><span>地球環境學群</span></label>
            </li>
            <li>
              <label><input type="checkbox" name="input-department-group" value="醫藥衛生學群"><span>醫藥衛生學群</span></label>
            </li>
            <li>
              <label><input type="checkbox" name="input-department-group" value="管理學群"><span>管理學群</span></label>
            </li>
            <li>
              <label><input type="checkbox" name="input-department-group" value="建築設計學群"><span>建築設計學群</span></label>
            </li>
            <li>
              <label><input type="checkbox" name="input-department-group" value="遊憩運動學群"><span>遊憩運動學群</span></label>
            </li>
            <li>
              <label><input type="checkbox" name="input-department-group" value="財經學群"><span>財經學群</span></label>
            </li>
            <li>
              <label><input type="checkbox" name="input-department-group" value="生命科學學群"><span>生命科學學群</span></label>
            </li>
            <li>
              <label><input type="checkbox" name="input-department-group" value="社會心理學群"><span>社會心理學群</span></label>
            </li>
            <li>
              <label><input type="checkbox" name="input-department-group" value="大眾傳播學群"><span>大眾傳播學群</span></label>
            </li>
            <li>
              <label><input type="checkbox" name="input-department-group" value="外語學群"><span>外語學群</span></label>
            </li>
            <li>
              <label><input type="checkbox" name="input-department-group" value="生物資源學群"><span>生物資源學群</span></label>
            </li>
            <li>
              <label><input type="checkbox" name="input-department-group" value="法政學群"><span>法政學群</span></label>
            </li>
            <li>
              <label><input type="checkbox" name="input-department-group" value="藝術學群"><span>藝術學群</span></label>
            </li>
            <li>
              <label><input type="checkbox" name="input-department-group" value="文史哲學群"><span>文史哲學群</span></label>
            </li>
            <li>
              <label><input type="checkbox" name="input-department-group" value="教育學群"><span>教育學群</span></label>
            </li>
            <li>
              <label><input type="checkbox" name="input-department-group" value="不分系學群"><span>不分系學群</span></label>
            </li>
          </ul>
        </div>
      </div>

      <!-- 輸入校系 -->
      <div id="input-school-area">
        <div id="input-state-group-area">
          <h2>地區</h2>
          <a id="input-state-group-more" >
            <p id="state-group-choose-list">台北市, 桃園市</p>
            <span class="more-button">&#x25BC;</span>
          </a>
          <div id="input-state-group-choose-area" class="hidden">
            <ul>
              <li><label><input type="checkbox" name="input-state-group" value="基隆市"><span>基隆市</span></label></li>
              <li><label><input type="checkbox" name="input-state-group" value="台北市"><span>台北市</span></label></li>
              <li><label><input type="checkbox" name="input-state-group" value="新北市"><span>新北市</span></label></li>
              <li><label><input type="checkbox" name="input-state-group" value="桃園市"><span>桃園市</span></label></li>
              <li><label><input type="checkbox" name="input-state-group" value="新竹縣市"><span>新竹縣市</span></label></li>
              <li><label><input type="checkbox" name="input-state-group" value="苗栗縣"><span>苗栗縣</span></label></li>
              <li><label><input type="checkbox" name="input-state-group" value="台中市"><span>台中市</span></label></li>
              <li><label><input type="checkbox" name="input-state-group" value="彰化縣"><span>彰化縣</span></label></li>
              <li><label><input type="checkbox" name="input-state-group" value="南投縣"><span>南投縣</span></label></li>
              <li><label><input type="checkbox" name="input-state-group" value="嘉義縣市"><span>嘉義縣市</span></label></li>
              <li><label><input type="checkbox" name="input-state-group" value="台南市"><span>台南市</span></label></li>
              <li><label><input type="checkbox" name="input-state-group" value="高雄市"><span>高雄市</span></label></li>
              <li><label><input type="checkbox" name="input-state-group" value="屏東縣"><span>屏東縣</span></label></li>
              <li><label><input type="checkbox" name="input-state-group" value="宜蘭縣"><span>宜蘭縣</span></label></li>
              <li><label><input type="checkbox" name="input-state-group" value="花蓮縣"><span>花蓮縣</span></label></li>
              <li><label><input type="checkbox" name="input-state-group" value="台東縣"><span>台東縣</span></label></li>
              <li><label><input type="checkbox" name="input-state-group" value="金門縣"><span>金門縣</span></label></li>
            </ul>
          </div>
        </div>
      </div>

      <div id="input-university-group-area">
        <h2>公/私立</h2>
        <ul>
          <li>
            <label><input id="public" type="checkbox" name="input-university-group" value="公立" checked="true"><span>公立</span></label>
          </li>
          <li>
            <label><input id="private" type="checkbox" name="input-university-group" value="私立" checked="true"><span>私立</span></label>
          </li>
        </ul>
      </div>

      <!-- 查詢按鈕 -->
      <div id="input-action-area">
        <ul>
          <li><input type="submit" value="開始分析"></li>
        </ul>
      </div>
    </form>
  </div>

</section>

<!-- 下方白色內容顯示區 -->
<section id="container" class="page-section">
  <!-- ref:include footer -->
  <!-- endref -->
</section>

<script src="../assets/jquery.min.js"></script>
<script src="../assets/foundation.min.js"></script>
<script src="../assets/jquery.floatThead.min.js"></script>
<script src="../js/calc-rem-tools.js"></script>
<script src="../js/department-group-choose.js"></script>
<script charset="utf-8" src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<script src="js/send-predict-data-to-liff.js"></script>
<script>
  window.onload = function() {
    $(document).foundation();
    $('#result-area table').floatThead({
      scrollingTop: convertRem(6),
      zIndex: 5,
      useAbsolutePositioning: true}
    );
  };
</script>
</body>
</html>
